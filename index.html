<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Toggle a three-variable Karnaugh map and find an exact minimal sum-of-products expression.">
  <title>Karnaugh Map Simplifier</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
<main>
  <div class="heading">
    <div><h1>Karnaugh Map Simplifier</h1><p>Toggle a three-variable Karnaugh map and find an exact minimal sum-of-products expression.</p></div>
    <a href="https://github.com/netcodermike/karnaugh-map-simplifier">Project source ↗</a>
  </div>
  <div class="workspace">
    <section class="panel stage" aria-label="Project workspace">
      <table class="truth" aria-label="Three-variable Karnaugh map"><thead><tr><th scope="col">A / BC</th><th scope="col">00</th><th scope="col">01</th><th scope="col">11</th><th scope="col">10</th></tr></thead>
        <tbody id="map-body"></tbody></table><p class="extra" id="summary"></p>
      <p id="reading" role="status"></p>
    </section>
    <section class="panel controls" aria-label="Controls">
      <p>Toggle cells between 0 and 1. Select a product term to highlight all the minterms it covers. The first and last columns are adjacent.</p>
        <div id="terms" class="term-list" role="group" aria-label="Product terms"></div>
        <div class="actions"><button id="clear" type="button">Clear map</button><button id="example" type="button">Load example</button></div>
    </section>
  </div>
</main>
</body>
</html>
